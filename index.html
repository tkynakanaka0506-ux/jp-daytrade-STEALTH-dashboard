<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>STEALTH AMBUSH ENGINE v6.3</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Noto+Sans+JP:wght@300;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0f; --card:rgba(18,20,30,.92); --neon:#00e5ff; --purple:#b86bff; --red:#ff4d6d; --green:#00ff9d; --amber:#ffc107; --text2:#d0d8f0; }
body { background:var(--bg); color:var(--text2); font-family:'Noto Sans JP'; margin:0; padding:40px 20px; }
.container{max-width:1200px;margin:auto}
h1 { font-family:'Orbitron'; font-size:2.4em; letter-spacing:8px; text-align:center; background:linear-gradient(90deg,var(--neon),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:5px; }
.sub{text-align:center;color:#66708a;letter-spacing:4px;font-size:.75em;margin-bottom:45px}
.section-title{font-family:'Orbitron';font-size:1.2em;margin:45px 0 22px;border-left:5px solid var(--purple);padding-left:15px;letter-spacing:2px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.08);padding:28px;margin-bottom:22px;position:relative;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,.45)}
.card.b{border-left:4px solid var(--purple)}
.card.ambush{background:linear-gradient(135deg, rgba(184,107,255,.15), rgba(18,20,30,.95));border:1px solid rgba(184,107,255,.4)}
.card.ambush.watch-bg{background:linear-gradient(135deg, rgba(255,193,7,.15), rgba(18,20,30,.95));border:1px solid rgba(255,193,7,.5)}
.card.ambush.warn-bg{background:linear-gradient(135deg, rgba(255,77,109,.2), rgba(18,20,30,.95));border:1px solid rgba(255,77,109,.6)}
.score-box,.suprise-box{position:absolute;top:22px;right:22px;text-align:right}
.score-val{font-family:'Orbitron';font-size:2.6em;font-weight:900;color:var(--neon)}
.suprise-val{font-family:'Orbitron';font-size:2.2em;font-weight:900;color:var(--green)}
.gap{color:var(--purple)}
.grade{font-family:'Orbitron';font-size:1.4em;font-weight:900;display:inline-block;padding:2px 10px;border-radius:6px;margin-top:3px}
.gS{color:#000;background:var(--green)}
.gA{color:#000;background:var(--neon)}
.gB{color:#000;background:var(--purple)}
h2{margin:0 0 14px;font-size:1.15em;color:#fff}
.badges{margin:10px 0}
.badge{font-size:.65em;padding:3px 9px;border:1px solid #445;margin-right:7px;border-radius:6px;font-weight:bold;display:inline-block;margin-bottom:5px;color:var(--text2)}
.s-rank{border-color:var(--neon);color:var(--neon);background:rgba(0,229,255,.08)}
.earn{border-color:var(--purple);color:var(--purple);background:rgba(184,107,255,.08)}
.clean-ok{border-color:var(--green);color:var(--green)}
.clean-warn{border-color:var(--red);color:var(--red)}
.squeeze{border-color:var(--amber);color:var(--amber);background:rgba(255,193,7,.08)}
.heavy{border-color:var(--red);color:var(--red);background:rgba(255,77,109,.1)}
.over{border-color:var(--amber);color:var(--amber);background:rgba(255,193,7,.08)}
.fold{border-color:var(--red);color:var(--red);background:rgba(255,77,109,.1)}
.flow{border-color:var(--amber);color:var(--amber)}
.b-ai{border-color:var(--purple);color:var(--purple)}
.warn{border-color:var(--red);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0;background:rgba(0,0,0,.3);padding:14px;border-radius:8px}
.label{font-size:.6em;color:#778;display:block;text-transform:uppercase;margin-bottom:4px}
.value{font-family:'Orbitron';font-size:.92em;color:#fff}
.real-data{display:flex;gap:22px;flex-wrap:wrap;padding:9px 13px;margin:10px 0;background:rgba(0,255,157,.06);border-left:3px solid var(--green);border-radius:6px;font-size:.78em;color:var(--green)}
.ambush-reason{background:rgba(184,107,255,.12);border-left:3px solid var(--purple);padding:11px;margin:10px 0;border-radius:6px;font-size:.85em;color:#e6d9ff}
.why{background:rgba(0,229,255,.06);border-left:3px solid var(--neon);padding:12px;border-radius:6px;font-size:.88em;color:#cfe9ff}
.placeholder{text-align:center;color:#66708a;padding:40px;border:1px dashed #334;border-radius:10px;font-family:'Orbitron';letter-spacing:3px}
.footer{text-align:center;color:#445;font-size:.65em;margin-top:50px;letter-spacing:2px}
</style></head><body>
<div class="container">
<header><h1>STEALTH v6.3</h1><div class="sub">EARNINGS-AMBUSH WITH LIQUIDITY & FUNDAMENTAL FILTER</div></header>

<div class="section-title">🎯 SECTION C: 決算先読みアンビッシュ（待ち伏せ / 2週間〜1ヶ月）</div>
<div class="placeholder">決算待ち伏せ対象がありません。決算前2週間〜1ヶ月の銘柄を監視しています。</div>

<div class="section-title">🔍 SECTION A: ステルス先回り候補（清純度順）</div>
<div class="placeholder">クリーンな先回り候補は現在なし。</div>

<div class="section-title">⚡ SECTION B: 材料発表済み・織り込みチェック</div>


<div class="footer">STEALTH v6.3 // 月次・需給・流動性フィルター // 表示値はスクレイピング生データ</div>
</div></body></html>
